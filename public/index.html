<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tablero Early Builders / Developer Network de Think4Ever">
  <meta name="color-scheme" content="dark">
  <title>Early Builders · Think4Ever</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" aria-label="Navegación principal" data-i18n-aria="shell.primary">
      <div class="logo-row">
        <div class="logo-mark" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M12 6v14M7 14l5 6 5-6"/></svg></div>
        <div class="logo-name">Think4Ever <span>Builders</span></div>
      </div>
      <nav aria-label="Secciones del tablero" data-i18n-aria="shell.sections">
        <div class="nav-section-label" data-i18n="nav.program">Programa</div>
        <a class="nav-item" href="#overview" data-view="overview"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span data-i18n="nav.overview">Resumen</span></a>
        <a class="nav-item" href="#builders" data-view="builders"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span data-i18n="nav.builders">Builders</span><span class="nav-count" id="nav-builders-count">–</span></a>
        <a class="nav-item" href="#invitations" data-view="invitations"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg><span data-i18n="nav.invitations">Inscripción</span></a>
        <a class="nav-item" href="#sources" data-view="sources"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg><span data-i18n="nav.sources">Fuentes de datos</span></a>
      </nav>

      <div class="nav-section-label" data-i18n="nav.controls">Controles</div>
      <div class="t4-controls">
        <label for="period-select" data-i18n="ctl.period">Periodo</label>
        <select id="period-select">
          <option value="all" data-i18n="period.all">Todo el periodo</option>
          <option value="30d" data-i18n="period.30d">Últimos 30 días</option>
          <option value="14d" data-i18n="period.14d">Últimos 14 días</option>
          <option value="7d" data-i18n="period.7d">Últimos 7 días</option>
        </select>
        <label for="lang-select" data-i18n="ctl.language">Idioma</label>
        <select id="lang-select">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </div>
      <button type="button" class="btn btn-secondary btn-sm t4-refresh" id="refresh-btn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span data-i18n="ctl.refresh">Actualizar</span></button>

      <div class="sidebar-spacer"></div>

      <div class="user-card">
        <div class="user-avatar" id="user-avatar">·</div>
        <div class="user-meta">
          <div class="user-name" id="user-name">—</div>
          <div class="user-role"><span class="pill pill-neutral" id="user-access">—</span></div>
        </div>
        <a class="ghost-icon-btn user-logout" href="auth/logout" title="Cerrar sesión" aria-label="Cerrar sesión" data-i18n-title="common.logout" data-i18n-aria="common.logout"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></a>
      </div>
    </aside>

    <main class="page-main">
      <nav class="t4-mobile-tabs" aria-label="Secciones del tablero" data-i18n-aria="shell.sections">
        <div class="t4-mobile-brand">
          <span class="logo-mark" aria-hidden="true"></span><span>Think4Ever</span>
          <span class="pill pill-neutral" id="mobile-access">—</span>
          <label class="sr-only" for="lang-select-mobile" data-i18n="ctl.language">Idioma</label>
          <select id="lang-select-mobile" class="mobile-lang"><option value="es">ES</option><option value="en">EN</option></select>
          <a class="ghost-icon-btn" href="auth/logout" aria-label="Cerrar sesión" data-i18n-aria="common.logout"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></a>
        </div>
        <div class="t4-mobile-row">
          <a class="nav-item" href="#overview" data-view="overview" data-i18n="nav.overview">Resumen</a>
          <a class="nav-item" href="#builders" data-view="builders" data-i18n="nav.builders">Builders</a>
          <a class="nav-item" href="#invitations" data-view="invitations" data-i18n="nav.invitations">Invitaciones</a>
          <a class="nav-item" href="#sources" data-view="sources" data-i18n="nav.sources">Fuentes de datos</a>
        </div>
      </nav>

      <header class="topbar">
        <div class="topbar-left">
          <div class="page-kicker" data-i18n="shell.kicker">Red de Desarrolladores Think4Ever</div>
          <h1 class="page-title" id="page-title">Resumen</h1>
          <div class="shell-crumb"><span>t4</span>/<span data-i18n="shell.crumb">early-builders</span>/<b id="page-crumb">Resumen</b></div>
        </div>
        <div class="shell-head-right">
          <div class="shell-snapshot">
            <span class="snap-label" data-i18n="shell.snapshot">Última sincronización</span>
            <span class="snap-value mono is-empty" id="snap-value">—</span>
          </div>
          <div class="shell-profile">
            <span class="ini" id="profile-ini" aria-hidden="true">·</span>
            <span class="who" id="profile-name">—</span>
            <span class="pill pill-neutral"><svg class="ico ico-xs" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-i18n="common.readonly">Solo lectura</span></span>
          </div>
        </div>
      </header>

      <div class="page-inner">

        <div id="view-root" aria-live="polite"></div>

        <footer class="page-foot">
          <span data-i18n="foot.left">THINK4EVER · EARLY BUILDERS</span>
          <span class="foot-status" id="foot-status"><i></i><span id="foot-status-text">—</span></span>
        </footer>
      </div>
    </main>
  </div>

  <div id="full-page" hidden></div>

  <div class="shell-toast" id="toast" role="status" aria-live="polite" aria-hidden="true">
    <svg class="ico t-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <div class="t-body"><div class="t-title" id="toast-title"></div><p class="t-text" id="toast-text"></p></div>
    <button type="button" class="t-close" id="toast-close" aria-label="Cerrar mensaje" data-i18n-aria="toast.close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>

  <noscript><p class="noscript">Este tablero necesita JavaScript. / This dashboard requires JavaScript.</p></noscript>

  <script src="dashboard-core.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/views/overview.js" defer></script>
  <script src="js/views/builders.js" defer></script>
  <script src="js/views/invitations.js" defer></script>
  <script src="js/views/sources.js" defer></script>
  <script src="js/views/states.js" defer></script>
  <script src="app.js" defer></script>

</html>
